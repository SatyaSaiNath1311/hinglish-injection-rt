seed: 42

paths:
  data_dir: data
  results_dir: results
  cache_dir: .cache/detector_scores

# Verify each model's output labels (model.config.id2label) before trusting malicious_labels.
detectors:
  - name: regex_baseline
    type: regex

  - name: protectai_deberta
    type: hf
    model_id: protectai/deberta-v3-base-prompt-injection-v2
    malicious_labels: [INJECTION]

  - name: llama_prompt_guard_2
    type: hf
    model_id: meta-llama/Llama-Prompt-Guard-2-86M   # gated: needs HF_TOKEN + accepted license
    malicious_labels: [LABEL_1]

  # Your own PromptGuard (DistilBERT + regex). Point model_id to the local checkpoint, then enable.
  - name: promptguard_own
    type: hybrid
    model_id: ./models/promptguard
    malicious_labels: [LABEL_1]
    enabled: false

attacker:
  env:
    max_steps: 8
    alpha: 1.0          # weight on (1 - detector score)
    beta: 0.5           # weight on intent preservation
    gamma: 0.05         # cost per query/edit
    tau: 0.7            # min intent score for a valid evasion
    success_bonus: 2.0
  ppo:
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 64
    gamma: 0.99
